<!DOCTYPE html>
<html>
<head>
    <title>Notes Repair Test</title>
</head>
<body>
    <h1>Notes</h1>
    <form method="post" action="/add">
        <input type="text" name="content" placeholder="Add a note" required>
        <button type="submit">Add</button>
    </form>
    <ul>
        {% for note in notes %}
        <li>{{ note.content }} ({{ note.date }})</li>
        {% endfor %}
    </ul>
    <a href="/delete/1">Delete</a>
</body>
</html>
